<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedRecall AI</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f7fb; color: #172033; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 20px; }
    .card { background: white; border-radius: 18px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    h1 { margin-bottom: 8px; }
    textarea { width: 100%; min-height: 150px; box-sizing: border-box; padding: 14px; border-radius: 12px; border: 1px solid #ccd3df; font: inherit; }
    button { margin-top: 12px; padding: 12px 18px; border: 0; border-radius: 10px; background: #172033; color: white; font-weight: 700; }
    .answer { white-space: pre-wrap; margin-top: 20px; line-height: 1.6; }
    .chip { display: inline-block; margin: 5px 5px 0 0; padding: 8px 10px; border-radius: 999px; background: #eef2f8; cursor: pointer; font-size: 14px; }
    footer { margin-top: 20px; font-size: 12px; color: #667085; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <div>Open-source AI study tool</div>
    <h1>MedRecall AI</h1>
    <p>A focused AI assistant for medical exam revision.</p>
    <div>
      <span class="chip" data-q="Compare SIADH vs cerebral salt wasting">SIADH vs CSW</span>
      <span class="chip" data-q="Give 5-second recall for MI complications">MI complications</span>
      <span class="chip" data-q="Explain why hyperkalemia causes ECG changes">Hyperkalemia ECG</span>
    </div>
    <br />
    <textarea id="question" placeholder="Ask a medical concept or exam question..."></textarea>
    <button id="ask">Ask MedRecall AI</button>
    <div id="answer" class="answer"></div>
    <footer>Educational tool. Not a substitute for professional medical advice.</footer>
  </div>
</main>
<script>
  document.querySelectorAll(".chip").forEach(c =>
    c.onclick = () => document.getElementById("question").value = c.dataset.q
  );
  document.getElementById("ask").onclick = async () => {
    const question = document.getElementById("question").value;
    const answer = document.getElementById("answer");
    answer.textContent = "Thinking...";
    const r = await fetch("/api/ask", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({question})
    });
    const data = await r.json();
    answer.textContent = data.answer || data.error || "Something went wrong.";
  };
</script>
</body>
</html>
