<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedRecall AI</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;margin:0}
main{max-width:760px;margin:60px auto;padding:20px}
.card{background:white;padding:25px;border-radius:18px}
textarea{width:100%;height:150px;padding:14px;box-sizing:border-box;border:1px solid #ccd5e2;border-radius:12px;font-size:16px}
button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;font-weight:bold}
#out{white-space:pre-wrap;margin-top:20px}
</style>
</head>
<body>
<main>
<div class="card">
<p>OPEN-SOURCE AI STUDY TOOL</p>
<h1>MedRecall AI</h1>
<p>Focused AI study assistant for medical exam revision.</p>
<textarea id="q" placeholder="Ask a medical concept or exam question..."></textarea>
<br>
<button onclick="ask()">Ask MedRecall AI</button>
<div id="out"></div>
</div>
</main>
<script>
async function ask(){
const q=document.getElementById("q").value.trim();
const o=document.getElementById("out");
if(!q)return;
o.textContent="Thinking...";
try{
const r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})});
const d=await r.json();
o.textContent=d.answer||d.error||"No answer";
}catch(e){o.textContent="Request failed."}
}
</script>
</body>
</html>
